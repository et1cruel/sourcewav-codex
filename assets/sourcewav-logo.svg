<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" fill="none">
  <defs>
    <linearGradient id="swGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="wavGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d7fa48"/>
      <stop offset="100%" stop-color="#5cd6c6"/>
    </linearGradient>
    <filter id="textGlow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#5cd6c6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Disc icon -->
  <circle cx="26" cy="30" r="22" fill="#1a1a2e" stroke="#5cd6c6" stroke-width="1.5"/>
  <circle cx="26" cy="30" r="16" fill="none" stroke="#334155" stroke-width="0.8"/>
  <circle cx="26" cy="30" r="10" fill="none" stroke="#475569" stroke-width="0.8"/>
  <circle cx="26" cy="30" r="5" fill="url(#wavGrad)" opacity="0.9"/>
  <circle cx="26" cy="30" r="2" fill="#0f172a"/>
  <!-- soundwave bars on disc -->
  <rect x="22" y="27" width="2" height="6" rx="1" fill="#ffffff" opacity="0.85"/>
  <rect x="25.5" y="24" width="2" height="12" rx="1" fill="#ffffff"/>
  <rect x="29" y="26" width="2" height="8" rx="1" fill="#ffffff" opacity="0.85"/>

  <!-- SOURCE -->
  <text x="56" y="38"
    font-family="'Oswald', 'Impact', Arial Black, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="1"
    fill="url(#swGrad)"
  >SOURCE</text>

  <!-- WAV with gradient accent -->
  <text x="218" y="38"
    font-family="'Oswald', 'Impact', Arial Black, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="1"
    fill="url(#wavGrad)"
    filter="url(#textGlow)"
  >WAV</text>

  <!-- Underscore line for WAV -->
  <rect x="218" y="43" width="84" height="2.5" rx="1.5" fill="url(#wavGrad)" opacity="0.7"/>
</svg>
